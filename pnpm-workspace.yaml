# dsh-web-enhanced standalone workspace: this directory is its own pnpm
# workspace root (pnpm auto-excludes nested workspaces from any parent), so
# the plugin builds, tests, and installs independently of the dsh-plugins
# monorepo that used to host it.
#
# pnpm 11 build authorization: esbuild's postinstall fetches its platform
# binary; the prompt pnpm wrote earlier asked for an explicit choice.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/cosmokit@1.8.3'
  - '@deepseek-ai/schemastery@3.18.2'
