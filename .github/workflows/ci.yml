name: CI

on:
  push:
    branches: [master]
  pull_request:
  # canary 的定时闸门：宿主前移是时间驱动的，不是 push 驱动的。
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:

jobs:
  check:
    # 定时触发只为跑 canary；主矩阵要完整构建宿主，没必要陪跑。
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # 默认两矩阵（发布负责人可按支持面增删）：
        #  - Node 22：最低支持宿主。
        #  - Node 24：前向集成。
        # host-ref 是 smoke e2e 的宿主基线，钉在 rc.7 发布提交
        # （2026-08-17，全链路 e2e 首次全绿时的宿主）。宿主 master 前移
        # 不再能使本仓库变红；升级基线时把两行一起改到新验证过的 SHA。
        include:
          - node: 22
            host-ref: "99f6f02fecdb7dff40c3fbc9470f5907c29f74ca"
          - node: 24
            host-ref: "99f6f02fecdb7dff40c3fbc9470f5907c29f74ca"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      # 宿主 checkout 统一落在 $GITHUB_WORKSPACE/../../.dsh/source/current
      # （= $GITHUB_WORKSPACE 的规范化父级 .dsh）——smoke e2e 从这里取宿主
      # 二进制与 playwright chromium。
      # 按 ref 定向浅取而不是 clone 默认分支再 checkout：host-ref 钉的是
      # SHA，默认分支前移后浅克隆里不会再有它，checkout 必然失败。
      - name: Clone dsh main repo at DSH_ROOT
        run: |
          DSH_ROOT="$GITHUB_WORKSPACE/../../.dsh/source/current"
          mkdir -p "$DSH_ROOT"
          git init -q "$DSH_ROOT"
          git -C "$DSH_ROOT" remote add origin "https://github.com/deepseek-ai/deepseek-harness.git"
          git -C "$DSH_ROOT" fetch --depth 1 origin "${{ matrix.host-ref }}"
          git -C "$DSH_ROOT" checkout -q --detach FETCH_HEAD
          echo "HOST_SHA=$(git -C "$DSH_ROOT" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install + build host
        working-directory: ${{ github.workspace }}/../../.dsh/source/current
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck + full tests + build)
        run: pnpm run check

      - name: Pack verification gate
        run: node scripts/verify-pack.mjs

      # 提交进仓的 lib/ 必须与 src 一致：漂移 = 上次源码改动从未构建发布。
      - name: Verify lib matches src
        run: |
          git diff --exit-code -- lib/ || {
            echo "::error::lib/ 与 src/ 不一致：请运行 pnpm run build 并提交 lib/ 产物"
            exit 1
          }

      # no-key smoke：隔离 DSH_HOME + 精确宿主二进制 + 固定端口，绝不触碰
      # 任何活跃实例；宿主二进制必须位于本次 checkout 内。必须从 tarball
      # 安装，link: 会让 peer 依赖从插件真实路径解析出第二份协议模块，remote
      # 描述符因此对宿主网关不可见。
      - name: Smoke e2e (no model key)
        run: |
          TARBALL_NAME="$(npm pack --silent)"
          TARBALL_PATH="$GITHUB_WORKSPACE/$TARBALL_NAME"
          TARBALL_SHA="$(sha256sum "$TARBALL_PATH")"
          TARBALL_SHA="${TARBALL_SHA%% *}"
          node scripts/e2e.mjs --smoke --install tarball \
            --tarball "$TARBALL_PATH" --tarball-sha256 "$TARBALL_SHA" --port 3190
        env:
          DSH_ROOT: ${{ github.workspace }}/../../.dsh/source/current
          DSH_BIN: ${{ github.workspace }}/../../.dsh/source/current/apps/cli/lib/bin.js

      - name: Archive e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-*.png
            dsh-web.log
          if-no-files-found: ignore

  # ── 宿主前沿探针 ────────────────────────────────────────────────────────
  # 上面的矩阵故意把宿主钉死在已验证的 SHA，lockfile 也故意锁在最低支持版
  # （peerDependencies 的下界 0.1.0-rc.6）——那是「不会误用新 API」的保护，
  # 不是落后。代价是宿主继续前移时 CI 什么都不会说。
  #
  # 这个 job 补上另一半：把宿主包临时升到前沿再跑类型检查与单测，抓 API
  # 重命名、类型收窄、导出移除这类破坏性变更。改动只存在于 runner 上。
  # 允许失败：它报告的是「宿主动了什么」，不是「本仓库坏了」。
  #
  # 三个必须踩准的点（都是实测踩出来的）：
  #  1. 用 next 而不是 latest——rc.7 发布在 next 上，latest 还停在 rc.6，
  #     且 dsh-llm 的 latest 竟指向远古的 0.0.1-rc.1。
  #  2. 关掉 minimumReleaseAge——pnpm 11 的供应链策略会拒绝刚发布的版本，
  #     而 pnpm-workspace.yaml 的白名单是逐版本钉死的 rc.6 列表。
  #  3. 升级后必须断言版本真的变了——被策略挡住时 pnpm 只说
  #     "Already up to date" 并静默成功，探针会假装通过。
  host-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install at the pinned baseline
        run: pnpm install --frozen-lockfile

      - name: Upgrade the host packages to the frontier
        run: |
          BASELINE="$(node -p "require('./node_modules/@deepseek-ai/dsh-typert-protocol/package.json').version")"
          echo "baseline: $BASELINE"
          PKGS="$(node -p "
            Object.keys(require('./package.json').devDependencies)
              .filter(name => name.startsWith('@deepseek-ai/dsh'))
              .map(name => name + '@next')
              .join(' ')
          ")"
          pnpm add -D $PKGS --config.minimumReleaseAge=0
          FRONTIER="$(node -p "require('./node_modules/@deepseek-ai/dsh-typert-protocol/package.json').version")"
          echo "frontier: $FRONTIER"
          if [ "$BASELINE" = "$FRONTIER" ]; then
            echo "::warning::宿主前沿与基线相同（$BASELINE），本次探针没有验证任何新版本。" \
                 "若确信 next 上有更新版本，检查 pnpm 供应链策略是否仍在拦截。"
          fi
          echo "HOST_FRONTIER=$FRONTIER" >> "$GITHUB_ENV"

      - name: Typecheck and test against the frontier host
        run: |
          npx tsc -b --force
          npx vitest run

      - name: Report a breaking host change
        if: failure()
        run: |
          echo "::warning::宿主 $HOST_FRONTIER 与本插件不兼容——见上方 tsc/vitest 失败。" \
               "适配后上调 peerDependencies 下界、pnpm-workspace.yaml 的" \
               "minimumReleaseAgeExclude 白名单，以及 ci.yml 的 host-ref。"
